<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands-free Media Player</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --status-active: #22c55e;
      --status-inactive: #ef4444;
      --status-warning: #fbbf24;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* แก้ไข: ห้ามใช้ display:none กับกล้อง เพราะมือถือ (โดยเฉพาะ iOS)
       จะไม่ decode เฟรมวิดีโอที่ไม่ได้ถูก render จริง ทำให้ videoWidth/Height = 0
       ใช้เทคนิคย่อเหลือ 1px แล้วดันออกนอกจอแทน เพื่อให้ยัง render อยู่จริง */
    #webcam {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    video#media-player {
      width: 100%;
      display: block;
      background-color: #000;
    }

    .track-title {
      text-align: center;
      padding: 8px;
      font-size: 0.9rem;
      color: var(--accent-color);
      background: var(--card-bg);
      margin-top: -4px;
    }

    .status-panel {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .status-value {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .active { color: var(--status-active); }
    .inactive { color: var(--status-inactive); }
    .warning { color: var(--status-warning); }

    .sensor-note {
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }

    .debug-log {
      background: #000;
      color: #4ade80;
      font-family: monospace;
      font-size: 0.7rem;
      padding: 8px;
      border-radius: 8px;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    button {
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Hands-free Player</h2>
    <p class="sensor-note">
      📷 กล้อง: มองจอ = เล่น / ละสายตา = หยุด<br>
      📱 เอียงเบา = ปรับเสียง / เอียงแรงค้างไว้ = ข้ามเพลง
    </p>

    <!-- กล้องรับภาพลับหลัง สำหรับตรวจจับใบหน้าเท่านั้น -->
    <video id="webcam" playsinline autoplay muted></video>

    <div class="video-card">
      <video id="media-player" playsinline muted controls>
        <source src="" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
      </video>
    </div>
    <div class="track-title" id="track-title">กำลังโหลด...</div>

    <div class="status-panel">
      <div class="status-item">
        <div>เซ็นเซอร์กล้อง</div>
        <div id="face-status" class="status-value inactive">ไม่พบใบหน้า</div>
      </div>
      <div class="status-item">
        <div>Gyroscope (Gamma)</div>
        <div id="tilt-status" class="status-value">0°</div>
      </div>
      <div class="status-item">
        <div>ระดับเสียง (จากการเอียง)</div>
        <div id="volume-status" class="status-value">50%</div>
      </div>
      <div class="status-item">
        <div>คำสั่งข้ามเพลง</div>
        <div id="skip-status" class="status-value">รอคำสั่ง</div>
      </div>
    </div>

    <div class="debug-log" id="debug-log">รอเริ่มระบบ...</div>

    <button id="start-btn" onclick="startApp()">เปิดใช้งานเซ็นเซอร์คู่นี้</button>
  </div>

  <script>
    const mediaPlayer = document.getElementById('media-player');
    const webcamElement = document.getElementById('webcam');
    const trackTitleEl = document.getElementById('track-title');
    const skipStatusEl = document.getElementById('skip-status');
    const startBtn = document.getElementById('start-btn');
    const debugLogEl = document.getElementById('debug-log');

    function logDebug(msg) {
      const time = new Date().toLocaleTimeString();
      debugLogEl.innerText = `[${time}] ${msg}\n` + debugLogEl.innerText;
      console.log(msg);
    }

    // --- Playlist ตัวอย่าง ---
    const playlist = [
      { title: "Big Buck Bunny", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
      { title: "Elephants Dream", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
      { title: "Sintel", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
    ];
    let currentTrackIndex = 0;

    const SKIP_THRESHOLD = 45;
    const SKIP_HOLD_TIME = 900;
    let tiltStartTime = null;
    let tiltDirectionAtStart = null;
    let skipCooldown = false;

    let isFaceDetected = false;

    function loadTrack(index, autoplay = false) {
      currentTrackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[currentTrackIndex];
      mediaPlayer.querySelector('source').src = track.src;
      mediaPlayer.load();
      trackTitleEl.innerText = `🎵 ${currentTrackIndex + 1}/${playlist.length} — ${track.title}`;
      if (autoplay && isFaceDetected) {
        mediaPlayer.play().catch(e => logDebug("Autoplay ถูกบล็อก: " + e.message));
      }
    }

    function skipTrack(direction) {
      loadTrack(currentTrackIndex + direction, true);
      skipStatusEl.innerText = direction === 1 ? "⏭ ข้ามไปเพลงถัดไป" : "⏮ ย้อนเพลงก่อนหน้า";
      skipStatusEl.className = "status-value active";

      skipCooldown = true;
      setTimeout(() => {
        skipCooldown = false;
        skipStatusEl.innerText = "รอคำสั่ง";
        skipStatusEl.className = "status-value";
      }, 1500);
    }

    async function startApp() {
      startBtn.disabled = true;
      startBtn.innerText = "กำลังเริ่มระบบ...";
      logDebug("เริ่มขอสิทธิ์เซ็นเซอร์...");

      // 1. ขอสิทธิ์ DeviceOrientation (จำเป็นบน iOS 13+)
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            logDebug("Gyroscope: ได้รับสิทธิ์แล้ว");
          } else {
            logDebug("Gyroscope: ถูกปฏิเสธสิทธิ์");
          }
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
          logDebug("Gyroscope: ใช้งานได้ (ไม่ต้องขอสิทธิ์)");
        }
      } catch (err) {
        logDebug("Gyroscope error: " + err.message);
      }

      // 2. ขอสิทธิ์กล้องแบบ explicit ก่อน (ช่วยให้ error ชัดเจนกว่าปล่อยให้ Camera util จัดการเอง)
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 320, height: 240 }
        });
        webcamElement.srcObject = stream;
        await webcamElement.play();
        logDebug("กล้อง: ได้รับสิทธิ์และเริ่ม stream แล้ว");

        // 3. ตั้งค่า MediaPipe Face Detection
        const faceDetection = new FaceDetection({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });

        faceDetection.setOptions({
          modelSelection: 0,
          minDetectionConfidence: 0.5
        });

        faceDetection.onResults((results) => {
          logDebug(`ตรวจพบใบหน้า: ${results.detections?.length ?? 0}`);
          onFaceResults(results);
        });

        // 4. ใช้ Camera util ส่งเฟรมจาก webcamElement ที่ stream ทำงานอยู่แล้ว
        const camera = new Camera(webcamElement, {
          onFrame: async () => {
            await faceDetection.send({ image: webcamElement });
          },
          width: 320,
          height: 240
        });

        await camera.start();
        startBtn.innerText = "เซ็นเซอร์ทำงานแล้ว ✅";
        logDebug("MediaPipe: เริ่มส่งเฟรมแล้ว");
      } catch (err) {
        logDebug("กล้อง ERROR: " + err.name + " — " + err.message);
        alert("เปิดกล้องไม่ได้: " + err.message + "\n\nตรวจสอบว่า:\n1. เปิดผ่าน HTTPS\n2. อนุญาตสิทธิ์กล้องแล้ว\n3. ไม่มีแอปอื่นใช้กล้องอยู่");
        startBtn.disabled = false;
        startBtn.innerText = "เปิดใช้งานเซ็นเซอร์คู่นี้ (ลองใหม่)";
        return;
      }

      loadTrack(0);
    }

    // --- เซ็นเซอร์ที่ 1: กล้อง -> Play/Pause ---
    function onFaceResults(results) {
      const faceStatusEl = document.getElementById('face-status');

      if (results.detections && results.detections.length > 0) {
        isFaceDetected = true;
        faceStatusEl.innerText = "กำลังมองจอ (Play)";
        faceStatusEl.className = "status-value active";

        if (mediaPlayer.paused && mediaPlayer.querySelector('source').src) {
          mediaPlayer.play().catch(e => logDebug("Play ล้มเหลว: " + e.message));
        }
      } else {
        isFaceDetected = false;
        faceStatusEl.innerText = "ละสายตา (Pause)";
        faceStatusEl.className = "status-value inactive";

        if (!mediaPlayer.paused) {
          mediaPlayer.pause();
        }
      }
    }

    // --- เซ็นเซอร์ที่ 2: Gyroscope -> ปรับเสียง (เอียงเบา) หรือข้ามเพลง (เอียงแรงค้าง) ---
    function handleOrientation(event) {
      let gamma = event.gamma;
      if (gamma === null) return;

      document.getElementById('tilt-status').innerText = `${Math.round(gamma)}°`;

      const absGamma = Math.abs(gamma);

      if (absGamma >= SKIP_THRESHOLD) {
        const direction = gamma > 0 ? 1 : -1;

        if (tiltStartTime === null || tiltDirectionAtStart !== direction) {
          tiltStartTime = Date.now();
          tiltDirectionAtStart = direction;
        } else if (!skipCooldown && Date.now() - tiltStartTime >= SKIP_HOLD_TIME) {
          skipTrack(direction);
          tiltStartTime = null;
        }

        skipStatusEl.innerText = skipCooldown
          ? skipStatusEl.innerText
          : `กำลังค้าง (${direction === 1 ? "→ ถัดไป" : "← ก่อนหน้า"})`;
        skipStatusEl.className = "status-value warning";

      } else {
        tiltStartTime = null;
        tiltDirectionAtStart = null;
        if (!skipCooldown) {
          skipStatusEl.innerText = "รอคำสั่ง";
          skipStatusEl.className = "status-value";
        }

        let clampedGamma = Math.max(-30, Math.min(30, gamma));
        let volume = (clampedGamma + 30) / 60;

        mediaPlayer.volume = volume;
        document.getElementById('volume-status').innerText = `${Math.round(volume * 100)}%`;
      }
    }
  </script>
</body>
</html>
