<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands-free Media Player</title>
  
  <!-- MediaPipe Face Detection Library -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --status-active: #22c55e;
      --status-inactive: #ef4444;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ซ่อน video element ของกล้องไว้เบื้องหลัง */
    #webcam { display: none; }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    video#media-player {
      width: 100%;
      display: block;
      background-color: #000;
    }

    .status-panel {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .status-value {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .active { color: var(--status-active); }
    .inactive { color: var(--status-inactive); }

    button {
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Hands-free Player</h2>
    
    <!-- กล้องรับภาพลับหลัง -->
    <video id="webcam" playsinline></video>

    <!-- เครื่องเล่นวิดีโอหลัก -->
    <div class="video-card">
      <video id="media-player" loop playsinline muted controls>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
      </video>
    </div>

    <div class="status-panel">
      <div class="status-item">
        <div>เซ็นเซอร์กล้อง</div>
        <div id="face-status" class="status-value inactive">ไม่พบใบหน้า</div>
      </div>
      <div class="status-item">
        <div>Gyroscope (Gamma)</div>
        <div id="tilt-status" class="status-value">0°</div>
      </div>
      <div class="status-item" style="grid-column: span 2;">
        <div>ระดับเสียง (จากการเอียง)</div>
        <div id="volume-status" class="status-value">50%</div>
      </div>
    </div>

    <button onclick="startApp()">เปิดใช้งานเซ็นเซอร์คู่นี้</button>
  </div>

  <script>
    const mediaPlayer = document.getElementById('media-player');
    const webcamElement = document.getElementById('webcam');
    
    let lastTiltTime = 0;
    let isFaceDetected = false;

    async function startApp() {
      // 1. ขอสิทธิ์ Gyroscope / DeviceOrientation
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      // 2. ตั้งค่า MediaPipe Face Detection
      const faceDetection = new FaceDetection({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
      });

      faceDetection.setOptions({
        modelSelection: 0, // 0: สแกนระยะใกล้ (กล้องหน้ามือถือ)
        minDetectionConfidence: 0.6
      });

      faceDetection.onResults(onFaceResults);

      // 3. เริ่มส่งเฟรมจากกล้องหน้าเข้า Face Detection
      const camera = new Camera(webcamElement, {
        onFrame: async () => {
          await faceDetection.send({ image: webcamElement });
        },
        width: 320,
        height: 240
      });

      await camera.start();
    }

    // --- เซ็นเซอร์ตัวที่ 1: ตรวจจับใบหน้าเพื่อสั่ง Play/Pause ---
    function onFaceResults(results) {
      const faceStatusEl = document.getElementById('face-status');
      
      if (results.detections && results.detections.length > 0) {
        isFaceDetected = true;
        faceStatusEl.innerText = "กำลังมองจอ (Play)";
        faceStatusEl.className = "status-value active";

        // เล่นวิดีโอต่อเมื่อตรวจเจอใบหน้า
        if (mediaPlayer.paused) {
          mediaPlayer.play().catch(e => console.log("User gesture required"));
        }
      } else {
        isFaceDetected = false;
        faceStatusEl.innerText = "ละสายตา (Pause)";
        faceStatusEl.className = "status-value inactive";

        // หยุดวิดีโอเมื่อไม่อยู่หน้าจอ
        if (!mediaPlayer.paused) {
          mediaPlayer.pause();
        }
      }
    }

    // --- เซ็นเซอร์ตัวที่ 2: Gyroscope ตรวจจับการเอียงเพื่อปรับระดับเสียง ---
    function handleOrientation(event) {
      // event.gamma คือการเอียงเครื่อง ซ้าย (-90) / ขวา (+90)
      let gamma = event.gamma; 
      if (gamma === null) return;

      document.getElementById('tilt-status').innerText = `${Math.round(gamma)}°`;

      // ปรับระดับเสียงตามมุมเอียง (-30° ถึง +30°)
      // เอียงซ้าย = ลดเสียง, เอียงขวา = เพิ่มเสียง
      let clampedGamma = Math.max(-30, Math.min(30, gamma));
      let volume = (clampedGamma + 30) / 60; // แปลงค่าเป็นช่วง 0.0 - 1.0

      mediaPlayer.volume = volume;
      document.getElementById('volume-status').innerText = `${Math.round(volume * 100)}%`;
    }
  </script>
</body>
</html>
